# Generated by CodeRig. Regenerate: coderig connect
name: coderig-gate
on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CodeRig
        env:
          CODERIG_PIP_SPEC: ${{ vars.CODERIG_PIP_SPEC }}
        run: |
          if [ -z "$CODERIG_PIP_SPEC" ]; then
            echo "::error::Set the repository variable CODERIG_PIP_SPEC to your organisation's CodeRig package"
            exit 1
          fi
          pip install --quiet "$CODERIG_PIP_SPEC"
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.txt
      - run: |
          coderig gate \
            --base "${{ github.event.pull_request.base.sha }}" \
            --branch "${{ github.head_ref }}" \
            --pr-body /tmp/pr_body.txt
