  sensors:
  - id: dependency-policy
    description: Every dependency this change adds to a pom is on the project's approved list.
    kind: local
    run: python .coderig/checks.py dependency-policy
    agent: null
    policies: []
    escalation: null
    fix: null
    docker: null
    timeout: 60
    blocking: true
    applies_when:
    - pom.xml
    hint: This change adds a dependency that is not on the approved list (approved-dependencies.txt at
      the repository root). Do not add a new library. Use one the project already has, or write the small
      amount of code yourself. If a library is genuinely needed, stop and ask the developer to request
      its approval; do not edit the approved list yourself. Re-check with `python .coderig/verify.py --only
      dependency-policy`.
    cwd: null
  - id: format
    description: Code follows the project's formatter (Spring Java Format, tabs).
    kind: local
    run: mvn -q spring-javaformat:validate
    agent: null
    policies: []
    escalation: null
    fix: mvn -q spring-javaformat:apply
    docker:
      image: maven:3.9-eclipse-temurin-17
      workdir: /work
      cache:
        volume: coderig-m2
        path: /root/.m2
    timeout: 300
    blocking: true
    applies_when:
    - pom.xml
    hint: Formatting violations. This project uses Spring Java Format (tabs). Run `python .coderig/verify.py
      --fix format` (it runs `mvn spring-javaformat:apply`) and re-check; do not hand-format.
    cwd: null
  - id: no-bypass
    description: This change adds no disabled test, lint suppression or skipped verification.
    kind: local
    run: python .coderig/checks.py no-bypass
    agent: null
    policies: []
    escalation: null
    fix: null
    docker: null
    timeout: 60
    blocking: true
    applies_when: []
    hint: This change disables a test, suppresses a lint or type check, or skips verification (--no-verify,
      -DskipTests and similar). Fix the code or the test instead. Do not disable, skip or suppress to
      get a green result. If a suppression is genuinely needed, the developer must approve it in review.
      Re-check with `python .coderig/verify.py --only no-bypass`.
    cwd: null
  - id: pii-exposure
    description: This change does not log, expose or export personal data in a way the personal-data-handling
      policy forbids.
    kind: inferential
    run: ''
    agent: pii-reviewer
    policies:
    - personal-data-handling
    escalation:
      block_on: high
      min_confidence: 0.7
      on_error: warn
    fix: null
    docker: null
    timeout: 120
    blocking: true
    applies_when: []
    hint: 'Launchpad''s pii-reviewer read this change against the personal-data-handling policy and found
      personal data that is logged, shown or exported where the policy forbids it. Each finding quotes
      the added line it is about. Fix the code, not the finding: log the id instead of the person, mask
      or drop the field in an export, keep personal data out of URLs, error messages and test fixtures.
      Do not rename a field or split a line to hide it from the review. If the field genuinely has to
      be there, stop and tell the developer why, so they can approve it in review. Re-check with `python
      .coderig/verify.py --only pii-exposure`.'
    cwd: null
  - id: secret-scan
    description: This change adds no credential, key or token to source, config, tests or fixtures.
    kind: local
    run: python .coderig/checks.py secret-scan
    agent: null
    policies: []
    escalation: null
    fix: null
    docker: null
    timeout: 60
    blocking: true
    applies_when: []
    hint: A credential, key or token was found in lines this change adds. Remove the value. Read the secret
      from the project's secret store (an environment variable or the vault) instead. Do not add the file
      or the line to .gitignore or a suppression list to get a green result. If the value was real, tell
      the developer it must be rotated, because it is now in the working tree. Re-check with `python .coderig/verify.py
      --only secret-scan`.
    cwd: null
  - id: tests
    description: The project compiles and its unit and slice tests pass.
    kind: local
    run: mvn -B test -Dspring-javaformat.skip=true -Dtest=!MySqlIntegrationTests,!PostgresIntegrationTests
