      workdir: /work
      cache:
        volume: coderig-m2
        path: /root/.m2
    timeout: 900
    blocking: true
    applies_when:
    - pom.xml
    hint: The build or the tests failed. Read the first compile error or the first failing test, and fix
      the code. Change a test only if the test itself is wrong, and never disable, skip or weaken one
      to get a green result. The MySQL and Postgres integration tests are excluded here because they need
      Docker inside the container. Re-check with `python .coderig/verify.py --only tests`.
    cwd: null
