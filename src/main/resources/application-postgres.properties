# database init, supports postgres too
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
spring.datasource.username=${POSTGRES_USER:petclinic}
spring.datasource.password=${POSTGRES_PASS:petclinic}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always

# StartupDataGuard: sequence-health feature flag (default ON)
petclinic.guard.sequences=true

# Actuator: wire startupDataGuard into the readiness health group
management.endpoint.health.group.readiness.include=readinessState,startupDataGuard
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
